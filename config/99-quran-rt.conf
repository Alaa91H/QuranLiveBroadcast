# Quran Live Broadcast - 1GB realtime-encode host tunables.
# Anon-heavy (Chrome/ffmpeg heaps) vs expendable pagecache: keep anon resident.
vm.swappiness = 20
# Reclaim dentries/inodes aggressively; Chrome pins many.
vm.vfs_cache_pressure = 200
# Trickle writeback: avoid default-ratio bursts stalling RTMP + swap on one volume.
vm.dirty_background_bytes = 8388608
vm.dirty_bytes = 16777216
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 250
# 32MB free reserve: kswapd headroom for the realtime encode thread.
vm.min_free_kbytes = 32768
# Single-page swap readahead: default 32KB wastes IO/RAM under thrash.
vm.page-cluster = 0
# Persistent RTMP push: never reset cwnd after idle (harmless, always sending).
net.ipv4.tcp_slow_start_after_idle = 0
